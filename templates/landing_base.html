<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Case Closed | AI-Assisted Litigation Workspace{% endblock %}</title>
    <meta name="description" content="{% block description %}Case Closed helps solo and small-firm litigators organize matter records, research relevant authority, build timelines, and prepare review-ready legal drafts.{% endblock %}">
    <meta name="theme-color" content="#4a3228">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Case Closed | AI-Assisted Litigation Workspace">
    <meta property="og:description" content="From case file to first draft, faster. Organize the record, uncover relevant authority, and prepare review-ready legal work.">
    <meta property="og:url" content="{{ url_for('main.index', _external=True) }}">
    <meta property="og:image" content="{{ url_for('static', filename='landing/og-case-closed-v3.png', _external=True) }}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Case Closed litigation workspace showing an organized matter record, timeline, authority, and legal draft.">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Case Closed | AI-Assisted Litigation Workspace">
    <meta name="twitter:description" content="From case file to first draft, faster.">
    <meta name="twitter:image" content="{{ url_for('static', filename='landing/og-case-closed-v3.png', _external=True) }}">
    <link rel="canonical" href="{{ url_for('main.index', _external=True) }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='briefcase.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='briefcase.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='tokens.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='landing.css') }}">
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    {% block content %}{% endblock %}
    <script src="{{ url_for('static', filename='landing.js') }}" defer></script>
</body>
</html>
